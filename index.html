<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qualineo — Performance Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --blue: #2B4EE6;
    --blue-dark: #1A3599;
    --blue-light: #3D6BF5;
    --navy: #0F2060;
    --yellow: #F5A623;
    --coral: #F47B6E;
    --green: #5BC98A;
    --white: #FFFFFF;
    --cream: #FDF6EF;
    --grey-light: #E8EDF5;
    --grey-text: #6B7A99;
    --text-dark: #1A2340;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--text-dark); min-height: 100vh; }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #1A3599 0%, #2B4EE6 50%, #3D6BF5 100%);
    padding: 20px 32px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon {
    width: 40px; height: 40px; background: rgba(255,255,255,0.2);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800; color: white;
  }
  .logo-text { font-size: 20px; font-weight: 700; color: white; }
  .header-title { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.75); }
  .last-update { font-size: 12px; color: rgba(255,255,255,0.6); }

  /* FILTERS */
  .filters {
    background: white;
    padding: 16px 32px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    box-shadow: 0 2px 12px rgba(43,78,230,0.08);
  }
  .filter-label { font-size: 13px; font-weight: 600; color: var(--grey-text); }
  .filter-btn {
    padding: 7px 16px; border-radius: 999px; border: 2px solid var(--grey-light);
    background: white; color: var(--text-dark); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .filter-btn.active { background: var(--blue); color: white; border-color: var(--blue); }
  .filter-btn:hover:not(.active) { border-color: var(--blue); color: var(--blue); }
  .divider { width: 1px; height: 24px; background: var(--grey-light); }

  /* MAIN */
  .main { padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
  .section-title {
    font-size: 18px; font-weight: 700; color: var(--navy);
    margin-bottom: 16px; margin-top: 28px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title:first-child { margin-top: 0; }
  .pill {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    background: var(--blue); color: white;
  }

  /* KPI GRID */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 8px; }
  .kpi-card {
    background: white; border-radius: 20px; padding: 20px 24px;
    box-shadow: 0 4px 24px rgba(43,78,230,0.08);
  }
  .kpi-card.blue { background: linear-gradient(135deg, #2B4EE6, #3D6BF5); color: white; }
  .kpi-card.yellow { background: var(--yellow); color: white; }
  .kpi-card.green { background: var(--green); color: white; }
  .kpi-card.coral { background: var(--coral); color: white; }
  .kpi-label { font-size: 12px; font-weight: 500; opacity: 0.75; margin-bottom: 6px; }
  .kpi-value { font-size: 28px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
  .kpi-sub { font-size: 12px; font-weight: 500; opacity: 0.7; }

  /* CHARTS GRID */
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .charts-grid.full { grid-template-columns: 1fr; }
  .chart-card {
    background: white; border-radius: 20px; padding: 24px;
    box-shadow: 0 4px 24px rgba(43,78,230,0.08);
  }
  .chart-card h3 { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 16px; }
  .chart-wrap { position: relative; height: 240px; }

  /* TABLE */
  .table-card {
    background: white; border-radius: 20px; padding: 24px;
    box-shadow: 0 4px 24px rgba(43,78,230,0.08); margin-top: 20px;
  }
  .table-card h3 { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600;
    color: var(--grey-text); text-transform: uppercase; letter-spacing: 0.5px;
    background: var(--cream); border-radius: 8px;
  }
  td { padding: 12px 14px; border-bottom: 1px solid var(--grey-light); }
  tr:last-child td { border-bottom: none; }
  .progress-bar { height: 6px; background: var(--grey-light); border-radius: 999px; margin-top: 4px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 999px; background: var(--blue); }
  .progress-fill.good { background: var(--green); }
  .progress-fill.warn { background: var(--yellow); }
  .progress-fill.bad { background: var(--coral); }
  .badge {
    display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
  }
  .badge.green { background: rgba(91,201,138,0.15); color: #2a9d6b; }
  .badge.yellow { background: rgba(245,166,35,0.15); color: #b87800; }
  .badge.red { background: rgba(244,123,110,0.15); color: #c0392b; }

  /* TABS */
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab {
    padding: 8px 20px; border-radius: 10px; border: 2px solid var(--grey-light);
    background: white; color: var(--grey-text); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .tab.active { background: var(--blue); color: white; border-color: var(--blue); }

  /* LOADING */
  .loading {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60vh; gap: 16px;
  }
  .spinner {
    width: 48px; height: 48px; border: 4px solid var(--grey-light);
    border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: var(--grey-text); font-weight: 500; }

  /* ERROR */
  .error-card {
    background: white; border-radius: 20px; padding: 32px; text-align: center;
    box-shadow: 0 4px 24px rgba(43,78,230,0.08);
  }
  .error-card h3 { color: var(--coral); margin-bottom: 8px; }
  .error-card p { color: var(--grey-text); font-size: 14px; }

  @media (max-width: 768px) {
    .main { padding: 16px; }
    .header { padding: 16px; }
    .charts-grid { grid-template-columns: 1fr; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">Q</div>
    <span class="logo-text">Qualineo</span>
  </div>
  <div style="text-align:center">
    <div class="header-title">Performance Dashboard — Équipe Commerciale</div>
  </div>
  <div class="last-update" id="lastUpdate">Chargement...</div>
</div>

<div class="filters">
  <span class="filter-label">Vue :</span>
  <button class="filter-btn active" onclick="setView('mensuelle')">Mensuelle</button>
  <button class="filter-btn" onclick="setView('trimestrielle')">Trimestrielle</button>
  <div class="divider"></div>
  <span class="filter-label">Mois :</span>
  <div id="monthFilters" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
  <div class="divider"></div>
  <span class="filter-label">Personne :</span>
  <div id="personFilters" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
</div>

<div class="main" id="mainContent">
  <div class="loading">
    <div class="spinner"></div>
    <div class="loading-text">Chargement des données Google Sheets...</div>
  </div>
</div>

<script>
const SHEET_ID = '1NfpK8RpEu-dftc2NildbKzsnDcxMYV9s0HnSHwM5ZVc';
const SHEET_NAME_SIGS = 'Signatures';
const SHEET_NAME_OBJ = 'Feuille 3';

let allData = [];
let objectives = {};
let currentView = 'mensuelle';
let activeMonths = new Set();
let activePersons = new Set();
let charts = {};

const MONTHS_ORDER = ['janv. 2026','févr. 2026','mars 2026','avr. 2026','mai 2026','juin 2026','juil. 2026','août 2026','sept. 2026','oct. 2026','nov. 2026','déc. 2026'];
const QUARTERS = {
  'Q1': ['janv. 2026','févr. 2026','mars 2026'],
  'Q2': ['avr. 2026','mai 2026','juin 2026'],
  'Q3': ['juil. 2026','août 2026','sept. 2026'],
  'Q4': ['oct. 2026','nov. 2026','déc. 2026']
};
const COLORS = {
  Antoine: '#2B4EE6', Arthur: '#5BC98A', Caroline: '#F47B6E',
  Baptiste: '#F5A623', Lucas: '#9B59B6', Antony: '#1ABC9C', Frederic: '#E67E22'
};

function parseNum(v) {
  if (!v) return 0;
  return parseFloat(String(v).replace(/\s/g,'').replace(',','.')) || 0;
}

async function fetchSheet(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Impossible de charger le sheet');
  const text = await res.text();
  return parseCSV(text);
}

function parseCSV(text) {
  const lines = text.split('\n');
  return lines.map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += c; }
    }
    cols.push(cur.trim());
    return cols;
  });
}

async function loadData() {
  try {
    const [sigRows, objRows] = await Promise.all([
      fetchSheet(SHEET_NAME_SIGS),
      fetchSheet(SHEET_NAME_OBJ)
    ]);

    // Parse signatures — header is row 0, data from row 1
    allData = [];
    for (let i = 1; i < sigRows.length; i++) {
      const r = sigRows[i];
      if (!r || r.length < 11) continue;
      const person = r[9] ? r[9].replace(/"/g,'').trim() : '';
      const moisSig = r[7] ? r[7].replace(/"/g,'').trim() : '';
      const moisFact = r[8] ? r[8].replace(/"/g,'').trim() : '';
      const montant = parseNum(r[4]);
      const partQ = parseNum(r[5]);
      const recurrent = parseNum(r[6]);
      if (!person || !moisSig) continue;
      allData.push({ person, moisSig, moisFact, montant, partQ, recurrent });
    }

    // Parse objectives
    // Row structure: Equipe | name | role | Q1obj | Q1real | Q1% | Q2obj | Q2real | Q2% | ...
    objectives = {};
    for (let i = 2; i < objRows.length; i++) {
      const r = objRows[i];
      if (!r || r.length < 6) continue;
      const name = r[1] ? r[1].replace(/"/g,'').trim() : '';
      if (!name || name === 'Squad' || name === 'Antoine' && r[2]?.includes('Lead')) {
        // skip squad rows and lead rows for now
      }
      if (!name) continue;
      const obj = {};
      ['Q1','Q2','Q3','Q4'].forEach((q, qi) => {
        obj[q] = { objectif: parseNum(r[3 + qi*3]), realise: parseNum(r[4 + qi*3]) };
      });
      objectives[name] = obj;
    }

    // Build filters
    const months = [...new Set(allData.map(d => d.moisSig))].sort((a,b) => MONTHS_ORDER.indexOf(a) - MONTHS_ORDER.indexOf(b));
    const persons = [...new Set(allData.map(d => d.person))].sort();

    activeMonths = new Set(months);
    activePersons = new Set(persons);

    buildFilters(months, persons);
    document.getElementById('lastUpdate').textContent = 'Mis à jour : ' + new Date().toLocaleString('fr-FR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    render();
  } catch (e) {
    document.getElementById('mainContent').innerHTML = `
      <div class="error-card">
        <h3>⚠️ Erreur de chargement</h3>
        <p>Vérifiez que le Google Sheet est bien partagé publiquement en lecture.<br><small>${e.message}</small></p>
      </div>`;
  }
}

function buildFilters(months, persons) {
  const mf = document.getElementById('monthFilters');
  mf.innerHTML = '';
  months.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn active';
    btn.textContent = m.replace(' 2026','');
    btn.onclick = () => { toggleSet(activeMonths, m); btn.classList.toggle('active'); render(); };
    mf.appendChild(btn);
  });

  const pf = document.getElementById('personFilters');
  pf.innerHTML = '';
  persons.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn active';
    btn.textContent = p;
    btn.style.borderColor = COLORS[p] || '#ccc';
    btn.onclick = () => {
      toggleSet(activePersons, p);
      btn.classList.toggle('active');
      if (btn.classList.contains('active')) btn.style.background = COLORS[p] || '#2B4EE6';
      else { btn.style.background = 'white'; btn.style.color = var_color(p); }
      render();
    };
    btn.style.background = COLORS[p] || '#2B4EE6';
    btn.style.color = 'white';
    pf.appendChild(btn);
  });
}

function var_color(p) { return COLORS[p] || '#1A2340'; }
function toggleSet(set, val) { set.has(val) ? set.delete(val) : set.add(val); }

function setView(v) {
  currentView = v;
  document.querySelectorAll('.filters .filter-btn').forEach(b => {
    if (b.textContent === 'Mensuelle' || b.textContent === 'Trimestrielle') {
      b.classList.toggle('active', (b.textContent === 'Mensuelle') === (v === 'mensuelle'));
    }
  });
  render();
}

function getFiltered() {
  return allData.filter(d => activePersons.has(d.person) && activeMonths.has(d.moisSig));
}

function getQuarterForMonth(m) {
  for (const [q, months] of Object.entries(QUARTERS)) {
    if (months.includes(m)) return q;
  }
  return null;
}

function render() {
  const data = getFiltered();
  const persons = [...activePersons].sort();

  if (currentView === 'mensuelle') renderMensuelle(data, persons);
  else renderTrimestrielle(data, persons);
}

function fmt(n) {
  if (!n) return '0 €';
  return Math.round(n).toLocaleString('fr-FR') + ' €';
}
function fmtK(n) {
  if (!n) return '0';
  if (n >= 1000) return (n/1000).toFixed(0) + 'k';
  return Math.round(n).toString();
}

function renderMensuelle(data, persons) {
  // Group by moisSig
  const months = [...new Set(data.map(d => d.moisSig))].sort((a,b) => MONTHS_ORDER.indexOf(a) - MONTHS_ORDER.indexOf(b));

  // KPIs global
  const totalSigne = data.reduce((s,d) => s + d.partQ, 0);
  const totalRecSigne = data.reduce((s,d) => s + d.recurrent, 0);
  // Facturé = sum of recurrent where moisFact is in activeMonths
  const factData = allData.filter(d => activePersons.has(d.person) && activeMonths.has(d.moisFact));
  const totalFact = factData.reduce((s,d) => s + d.recurrent, 0);

  // By person
  const byPerson = {};
  persons.forEach(p => {
    byPerson[p] = { signe: 0, recSigne: 0, facture: 0 };
    data.filter(d => d.person === p).forEach(d => { byPerson[p].signe += d.partQ; byPerson[p].recSigne += d.recurrent; });
    allData.filter(d => d.person === p && activePersons.has(d.person) && activeMonths.has(d.moisFact))
      .forEach(d => { byPerson[p].facture += d.recurrent; });
  });

  // By month
  const byMonth = {};
  months.forEach(m => {
    byMonth[m] = { signe: 0, recSigne: 0 };
    data.filter(d => d.moisSig === m).forEach(d => { byMonth[m].signe += d.partQ; byMonth[m].recSigne += d.recurrent; });
  });

  const html = `
    <div class="section-title">Vue d'ensemble <span class="pill">Mensuel</span></div>
    <div class="kpi-grid">
      <div class="kpi-card blue">
        <div class="kpi-label">Total Signé (Part Qualineo)</div>
        <div class="kpi-value">${fmt(totalSigne)}</div>
        <div class="kpi-sub">${data.length} contrats</div>
      </div>
      <div class="kpi-card green">
        <div class="kpi-label">Récurrent Signé</div>
        <div class="kpi-value">${fmt(totalRecSigne)}</div>
        <div class="kpi-sub">ARR signé sur la période</div>
      </div>
      <div class="kpi-card yellow">
        <div class="kpi-label">Récurrent Facturé</div>
        <div class="kpi-value">${fmt(totalFact)}</div>
        <div class="kpi-sub">Encaissé sur la période</div>
      </div>
      <div class="kpi-card coral">
        <div class="kpi-label">Nb commerciaux actifs</div>
        <div class="kpi-value">${persons.length}</div>
        <div class="kpi-sub">sur la période sélectionnée</div>
      </div>
    </div>

    <div class="section-title" style="margin-top:28px">Évolution mensuelle</div>
    <div class="charts-grid">
      <div class="chart-card">
        <h3>📈 Récurrent signé par mois</h3>
        <div class="chart-wrap"><canvas id="chartRecSigne"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>👤 Récurrent signé par commercial</h3>
        <div class="chart-wrap"><canvas id="chartByPerson"></canvas></div>
      </div>
    </div>

    <div class="section-title" style="margin-top:28px">Détail par commercial</div>
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Commercial</th>
            <th>Contrats</th>
            <th>Signé (Part Q.)</th>
            <th>Récurrent Signé</th>
            <th>Récurrent Facturé</th>
          </tr>
        </thead>
        <tbody>
          ${persons.map(p => {
            const nb = data.filter(d => d.person === p).length;
            return `<tr>
              <td><span style="display:inline-flex;align-items:center;gap:8px;">
                <span style="width:10px;height:10px;border-radius:50%;background:${COLORS[p]||'#ccc'};display:inline-block;"></span>
                <strong>${p}</strong>
              </span></td>
              <td>${nb}</td>
              <td>${fmt(byPerson[p]?.signe)}</td>
              <td>${fmt(byPerson[p]?.recSigne)}</td>
              <td>${fmt(byPerson[p]?.facture)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('mainContent').innerHTML = html;

  // Chart: récurrent signé par mois (stacked by person)
  destroyCharts();
  const ctx1 = document.getElementById('chartRecSigne').getContext('2d');
  charts.c1 = new Chart(ctx1, {
    type: 'bar',
    data: {
      labels: months.map(m => m.replace(' 2026','')),
      datasets: persons.map(p => ({
        label: p,
        data: months.map(m => data.filter(d => d.person === p && d.moisSig === m).reduce((s,d) => s + d.recurrent, 0)),
        backgroundColor: COLORS[p] || '#ccc',
        borderRadius: 6,
      }))
    },
    options: chartOptions('€', true)
  });

  const ctx2 = document.getElementById('chartByPerson').getContext('2d');
  charts.c2 = new Chart(ctx2, {
    type: 'doughnut',
    data: {
      labels: persons,
      datasets: [{
        data: persons.map(p => byPerson[p]?.recSigne || 0),
        backgroundColor: persons.map(p => COLORS[p] || '#ccc'),
        borderWidth: 0,
      }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { font: { family: 'Inter', size: 12 }, boxWidth: 12 } } } }
  });
}

function renderTrimestrielle(data, persons) {
  const quarters = ['Q1','Q2','Q3','Q4'];

  // Determine active quarters from active months
  const activeQ = new Set([...activeMonths].map(m => getQuarterForMonth(m)).filter(Boolean));

  // By quarter: sum recurrent signed and billed
  const byQSigne = {};
  const byQFact = {};
  quarters.forEach(q => {
    byQSigne[q] = 0; byQFact[q] = 0;
    data.filter(d => QUARTERS[q].includes(d.moisSig)).forEach(d => { byQSigne[q] += d.recurrent; });
    allData.filter(d => activePersons.has(d.person) && QUARTERS[q].includes(d.moisFact)).forEach(d => { byQFact[q] += d.recurrent; });
  });

  // By person by quarter
  const byPersonQ = {};
  persons.forEach(p => {
    byPersonQ[p] = {};
    quarters.forEach(q => {
      const signed = data.filter(d => d.person === p && QUARTERS[q].includes(d.moisSig)).reduce((s,d) => s + d.recurrent, 0);
      const obj = objectives[p]?.[q]?.objectif || 0;
      const pct = obj > 0 ? Math.round(signed / obj * 100) : null;
      byPersonQ[p][q] = { signed, obj, pct };
    });
  });

  const html = `
    <div class="section-title">Vue Trimestrielle <span class="pill">Q1–Q4 2026</span></div>
    <div class="kpi-grid">
      ${quarters.map(q => `
        <div class="kpi-card ${q==='Q1'?'blue':q==='Q2'?'green':q==='Q3'?'yellow':'coral'}">
          <div class="kpi-label">${q} — Récurrent Signé</div>
          <div class="kpi-value">${fmt(byQSigne[q])}</div>
          <div class="kpi-sub">Facturé : ${fmt(byQFact[q])}</div>
        </div>`).join('')}
    </div>

    <div class="section-title" style="margin-top:28px">Récurrent signé vs objectif par commercial</div>
    <div class="chart-card">
      <div class="chart-wrap" style="height:300px"><canvas id="chartQObj"></canvas></div>
    </div>

    <div class="section-title" style="margin-top:28px">Atteinte des objectifs par commercial</div>
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Commercial</th>
            ${quarters.map(q => `<th>${q} Signé</th><th>${q} Obj.</th><th>${q} %</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${persons.map(p => `<tr>
            <td><span style="display:inline-flex;align-items:center;gap:8px;">
              <span style="width:10px;height:10px;border-radius:50%;background:${COLORS[p]||'#ccc'};display:inline-block;"></span>
              <strong>${p}</strong>
            </span></td>
            ${quarters.map(q => {
              const d = byPersonQ[p][q];
              const pct = d.pct;
              const cls = pct === null ? '' : pct >= 100 ? 'green' : pct >= 70 ? 'yellow' : 'red';
              return `<td>${fmt(d.signed)}</td>
              <td>${d.obj ? fmt(d.obj) : '<span style="color:var(--grey-text)">N/A</span>'}</td>
              <td>${pct !== null ? `<span class="badge ${cls}">${pct}%</span>` : '<span style="color:var(--grey-text)">—</span>'}</td>`;
            }).join('')}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('mainContent').innerHTML = html;
  destroyCharts();

  // Grouped bar: signed vs obj per person per quarter (show Q1 Q2 for now)
  const visibleQ = quarters.filter(q => activeQ.has(q));
  const ctx = document.getElementById('chartQObj').getContext('2d');
  charts.c1 = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: persons,
      datasets: [
        ...visibleQ.map((q, i) => ({
          label: `${q} Signé`,
          data: persons.map(p => byPersonQ[p][q].signed),
          backgroundColor: ['#2B4EE6','#5BC98A','#F5A623','#F47B6E'][i] + 'CC',
          borderRadius: 6,
        })),
        ...visibleQ.map((q, i) => ({
          label: `${q} Objectif`,
          data: persons.map(p => byPersonQ[p][q].obj),
          backgroundColor: 'transparent',
          borderColor: ['#2B4EE6','#5BC98A','#F5A623','#F47B6E'][i],
          borderWidth: 2,
          type: 'bar',
          borderRadius: 6,
        }))
      ]
    },
    options: chartOptions('€', false)
  });
}

function chartOptions(unit, stacked) {
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { labels: { font: { family: 'Inter', size: 11 }, boxWidth: 12 } } },
    scales: {
      x: { stacked, grid: { display: false }, ticks: { font: { family: 'Inter', size: 11 } } },
      y: { stacked, grid: { color: '#E8EDF5' }, ticks: { font: { family: 'Inter', size: 11 }, callback: v => fmtK(v) + ' €' } }
    }
  };
}

function destroyCharts() {
  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e){} });
  charts = {};
}

loadData();
</script>
</body>
</html>
