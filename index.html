<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qualineo — Performance Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --blue:#2B4EE6;--blue-dark:#1A3599;--blue-light:#3D6BF5;--navy:#0F2060;
    --yellow:#F5A623;--coral:#F47B6E;--green:#5BC98A;
    --white:#FFFFFF;--cream:#FDF6EF;--grey-light:#E8EDF5;--grey-text:#6B7A99;--text-dark:#1A2340;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--text-dark);min-height:100vh;}

  .header{background:linear-gradient(135deg,#1A3599 0%,#2B4EE6 50%,#3D6BF5 100%);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;}
  .logo{display:flex;align-items:center;gap:12px;}
  .logo-icon{width:38px;height:38px;background:rgba(255,255,255,0.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:white;}
  .logo-text{font-size:20px;font-weight:700;color:white;}
  .header-sub{font-size:13px;color:rgba(255,255,255,0.7);}
  .last-update{font-size:12px;color:rgba(255,255,255,0.6);text-align:right;cursor:pointer;}
  .last-update:hover{color:white;}

  .filters{background:white;padding:12px 32px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(43,78,230,0.08);position:sticky;top:0;z-index:10;}
  .filter-label{font-size:11px;font-weight:600;color:var(--grey-text);white-space:nowrap;}
  .filter-btn{padding:5px 13px;border-radius:999px;border:2px solid var(--grey-light);background:white;color:var(--text-dark);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;}
  .filter-btn.active{background:var(--blue);color:white;border-color:var(--blue);}
  .divider{width:1px;height:20px;background:var(--grey-light);flex-shrink:0;}

  .main{padding:22px 32px;max-width:1400px;margin:0 auto;}
  .section-title{font-size:15px;font-weight:700;color:var(--navy);margin:22px 0 12px;display:flex;align-items:center;gap:8px;}
  .pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--blue);color:white;}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;}
  .kpi-card{background:white;border-radius:18px;padding:18px 20px;box-shadow:0 4px 24px rgba(43,78,230,0.08);}
  .kpi-card.blue{background:linear-gradient(135deg,#2B4EE6,#3D6BF5);color:white;}
  .kpi-card.yellow{background:var(--yellow);color:white;}
  .kpi-card.green{background:var(--green);color:white;}
  .kpi-card.coral{background:var(--coral);color:white;}
  .kpi-label{font-size:11px;font-weight:500;opacity:0.75;margin-bottom:5px;}
  .kpi-value{font-size:24px;font-weight:800;line-height:1;margin-bottom:3px;}
  .kpi-sub{font-size:11px;font-weight:500;opacity:0.7;}

  .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .chart-card{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 24px rgba(43,78,230,0.08);}
  .chart-card h3{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:12px;}
  .chart-wrap{position:relative;height:220px;}

  .table-card{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 24px rgba(43,78,230,0.08);margin-top:16px;overflow-x:auto;}
  .table-card h3{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:12px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:8px 11px;font-size:10px;font-weight:600;color:var(--grey-text);text-transform:uppercase;letter-spacing:0.4px;background:var(--cream);}
  td{padding:10px 11px;border-bottom:1px solid var(--grey-light);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#f8faff;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;}
  .badge.green{background:rgba(91,201,138,0.15);color:#1e8a52;}
  .badge.yellow{background:rgba(245,166,35,0.15);color:#a06b00;}
  .badge.red{background:rgba(244,123,110,0.15);color:#b03020;}
  .badge.grey{background:var(--grey-light);color:var(--grey-text);}

  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:14px;}
  .spinner{width:44px;height:44px;border:4px solid var(--grey-light);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{font-size:14px;color:var(--grey-text);font-weight:500;}

  @media(max-width:768px){
    .main{padding:12px;}.header{padding:14px;}.filters{padding:10px 12px;}
    .charts-grid{grid-template-columns:1fr;}.kpi-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">Q</div>
    <span class="logo-text">Qualineo</span>
  </div>
  <div style="text-align:center">
    <div style="font-size:15px;font-weight:600;color:white">Performance Dashboard</div>
    <div class="header-sub">Équipe Commerciale 2026</div>
  </div>
  <div class="last-update" id="lastUpdate" onclick="loadData()" title="Cliquer pour rafraîchir">—</div>
</div>

<div class="filters">
  <span class="filter-label">VUE :</span>
  <button class="filter-btn active" id="btn-mensuelle" onclick="setView('mensuelle')">Mensuelle</button>
  <button class="filter-btn" id="btn-trimestrielle" onclick="setView('trimestrielle')">Trimestrielle</button>
  <div class="divider"></div>
  <span class="filter-label">MOIS :</span>
  <div id="monthFilters" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
  <div class="divider"></div>
  <span class="filter-label">COMMERCIAL :</span>
  <div id="personFilters" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
</div>

<div class="main" id="mainContent">
  <div class="loading"><div class="spinner"></div><div class="loading-text">Chargement…</div></div>
</div>

<script>
const SHEET_ID = '1NfpK8RpEu-dftc2NildbKzsnDcxMYV9s0HnSHwM5ZVc';

// Objectifs hardcodés depuis Feuille 3 (structure trop dégradée pour parsing fiable)
// Format: { NOM: { Q1: obj, Q2: obj, Q3: obj, Q4: obj } }
const OBJECTIVES = {
  Caroline: { Q1: 90000, Q2: 45000,  Q3: 0,      Q4: 40000 },
  Antoine:  { Q1: 90000, Q2: 100000, Q3: 0,       Q4: 0     },
  Arthur:   { Q1: 90000, Q2: 90000,  Q3: 90000,   Q4: 90000 },
  Baptiste: { Q1: 0,     Q2: 60000,  Q3: 60000,   Q4: 80000 },
};

const MONTHS_ORDER = ['janv. 2026','févr. 2026','mars 2026','avr. 2026','mai 2026','juin 2026',
  'juil. 2026','août 2026','sept. 2026','oct. 2026','nov. 2026','déc. 2026'];
const QUARTERS = {
  Q1:['janv. 2026','févr. 2026','mars 2026'],
  Q2:['avr. 2026','mai 2026','juin 2026'],
  Q3:['juil. 2026','août 2026','sept. 2026'],
  Q4:['oct. 2026','nov. 2026','déc. 2026']
};
const COLORS = {
  Antoine:'#2B4EE6', Arthur:'#5BC98A', Caroline:'#F47B6E',
  Baptiste:'#F5A623', Lucas:'#9B59B6', Antony:'#1ABC9C', Frederic:'#E67E22'
};

let allSig = [];
let currentView = 'mensuelle';
let activeMonths = new Set();
let activePersons = new Set();
let charts = {};

function pn(v) {
  if (!v && v !== 0) return 0;
  return parseFloat(String(v).replace(/\s/g,'').replace(',','.')) || 0;
}
function fmt(n) { return Math.round(n||0).toLocaleString('fr-FR') + ' €'; }
function fmtK(n) { const v = Math.round(n||0); return v >= 1000 ? (v/1000).toFixed(0)+'k' : String(v); }
function getQ(m) { for(const [q,ms] of Object.entries(QUARTERS)) if(ms.includes(m)) return q; return null; }

async function loadData() {
  document.getElementById('lastUpdate').textContent = '↻ Chargement…';
  try {
    const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Signatures`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();

    allSig = rows
      .map(r => ({
        devis:    (r['N° Devis'] || '').trim(),
        person:   (r['Signé par'] || '').trim(),
        moisSig:  (r['Mois signature'] || '').trim(),
        moisFact: (r['Mois facturation'] || '').trim(),
        montant:  pn(r['Montant (€ HT)']),
        partQ:    pn(r['Part Qualineo']),
        recurrent:pn(r['Dont récurrent']),
      }))
      .filter(r => r.person && r.moisSig && MONTHS_ORDER.includes(r.moisSig));

    const months  = [...new Set(allSig.map(d => d.moisSig))]
      .sort((a,b) => MONTHS_ORDER.indexOf(a) - MONTHS_ORDER.indexOf(b));
    const persons = [...new Set(allSig.map(d => d.person))].sort();

    activeMonths  = new Set(months);
    activePersons = new Set(persons);

    buildFilters(months, persons);
    document.getElementById('lastUpdate').textContent =
      '↻ ' + new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    render();
  } catch(e) {
    document.getElementById('mainContent').innerHTML =
      `<div style="background:white;border-radius:18px;padding:32px;text-align:center;margin-top:20px;box-shadow:0 4px 24px rgba(43,78,230,0.08)">
        <div style="font-size:32px;margin-bottom:10px">⚠️</div>
        <h3 style="color:#F47B6E;margin-bottom:8px">Erreur de chargement</h3>
        <p style="color:#6B7A99;font-size:13px">${e.message}</p>
      </div>`;
    document.getElementById('lastUpdate').textContent = '↻ Erreur — cliquer pour réessayer';
  }
}

function buildFilters(months, persons) {
  // Month filters
  const mf = document.getElementById('monthFilters');
  mf.innerHTML = '';
  months.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn active';
    btn.textContent = m.replace(' 2026','');
    btn.onclick = () => {
      activeMonths.has(m) ? activeMonths.delete(m) : activeMonths.add(m);
      btn.classList.toggle('active');
      render();
    };
    mf.appendChild(btn);
  });

  // Person filters
  const pf = document.getElementById('personFilters');
  pf.innerHTML = '';
  persons.forEach(p => {
    const c = COLORS[p] || '#888';
    const btn = document.createElement('button');
    btn.className = 'filter-btn active';
    btn.textContent = p;
    btn.style.cssText = `background:${c};color:white;border-color:${c}`;
    btn.onclick = () => {
      if (activePersons.has(p)) {
        activePersons.delete(p);
        btn.style.cssText = `background:white;color:${c};border-color:${c}`;
        btn.classList.remove('active');
      } else {
        activePersons.add(p);
        btn.style.cssText = `background:${c};color:white;border-color:${c}`;
        btn.classList.add('active');
      }
      render();
    };
    pf.appendChild(btn);
  });
}

function setView(v) {
  currentView = v;
  document.getElementById('btn-mensuelle').classList.toggle('active', v==='mensuelle');
  document.getElementById('btn-trimestrielle').classList.toggle('active', v==='trimestrielle');
  render();
}

function getFiltered() {
  return allSig.filter(d => activePersons.has(d.person) && activeMonths.has(d.moisSig));
}

function destroyCharts() {
  Object.values(charts).forEach(c => { try{c.destroy();}catch(e){} });
  charts = {};
}

function chartOpts(stacked) {
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ labels:{ font:{family:'Inter',size:11}, boxWidth:11, padding:8 } } },
    scales:{
      x:{ stacked, grid:{display:false}, ticks:{font:{family:'Inter',size:11}} },
      y:{ stacked, grid:{color:'#E8EDF5'}, ticks:{font:{family:'Inter',size:11}, callback:v => fmtK(v)+' €'} }
    }
  };
}

// ── MENSUELLE ──────────────────────────────────────────────────────
function renderMensuelle(data, persons) {
  const months = [...new Set(data.map(d => d.moisSig))]
    .sort((a,b) => MONTHS_ORDER.indexOf(a) - MONTHS_ORDER.indexOf(b));

  const totalSigne  = data.reduce((s,d) => s+d.partQ, 0);
  const totalRecSig = data.reduce((s,d) => s+d.recurrent, 0);
  const factData    = allSig.filter(d => activePersons.has(d.person) && activeMonths.has(d.moisFact));
  const totalFact   = factData.reduce((s,d) => s+d.recurrent, 0);

  const byP = {};
  persons.forEach(p => {
    const pd = data.filter(d => d.person===p);
    const pf = allSig.filter(d => d.person===p && activeMonths.has(d.moisFact));
    byP[p] = {
      nb:       pd.length,
      signe:    pd.reduce((s,d)=>s+d.partQ,0),
      recSigne: pd.reduce((s,d)=>s+d.recurrent,0),
      facture:  pf.reduce((s,d)=>s+d.recurrent,0),
    };
  });

  const sorted = [...persons].sort((a,b) => (byP[b]?.recSigne||0)-(byP[a]?.recSigne||0));

  document.getElementById('mainContent').innerHTML = `
    <div class="section-title">Vue d'ensemble <span class="pill">Mensuel</span></div>
    <div class="kpi-grid">
      <div class="kpi-card blue">
        <div class="kpi-label">Signé Part Qualineo</div>
        <div class="kpi-value">${fmt(totalSigne)}</div>
        <div class="kpi-sub">${data.length} contrats</div>
      </div>
      <div class="kpi-card green">
        <div class="kpi-label">Récurrent Signé</div>
        <div class="kpi-value">${fmt(totalRecSig)}</div>
        <div class="kpi-sub">ARR sur la sélection</div>
      </div>
      <div class="kpi-card yellow">
        <div class="kpi-label">Récurrent Facturé</div>
        <div class="kpi-value">${fmt(totalFact)}</div>
        <div class="kpi-sub">Encaissé sur la sélection</div>
      </div>
      <div class="kpi-card coral">
        <div class="kpi-label">Commerciaux actifs</div>
        <div class="kpi-value">${persons.length}</div>
        <div class="kpi-sub">sur la sélection</div>
      </div>
    </div>

    <div class="section-title">Évolution mensuelle</div>
    <div class="charts-grid">
      <div class="chart-card">
        <h3>📈 Récurrent signé par mois (empilé)</h3>
        <div class="chart-wrap"><canvas id="cStack"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>🥧 Répartition par commercial</h3>
        <div class="chart-wrap"><canvas id="cDonut"></canvas></div>
      </div>
    </div>

    <div class="section-title">Détail par commercial</div>
    <div class="table-card">
      <table>
        <thead><tr>
          <th>Commercial</th><th>Contrats</th>
          <th>Signé Part Q.</th><th>Récurrent Signé</th><th>Récurrent Facturé</th>
        </tr></thead>
        <tbody>
          ${sorted.map(p => `<tr>
            <td><span style="display:inline-flex;align-items:center;gap:7px">
              <span class="dot" style="background:${COLORS[p]||'#ccc'}"></span>
              <strong>${p}</strong>
            </span></td>
            <td>${byP[p].nb}</td>
            <td>${fmt(byP[p].signe)}</td>
            <td><strong>${fmt(byP[p].recSigne)}</strong></td>
            <td>${fmt(byP[p].facture)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;

  destroyCharts();

  charts.c1 = new Chart(document.getElementById('cStack').getContext('2d'), {
    type:'bar',
    data:{
      labels: months.map(m=>m.replace(' 2026','')),
      datasets: persons.map(p => ({
        label: p,
        data: months.map(m => data.filter(d=>d.person===p&&d.moisSig===m).reduce((s,d)=>s+d.recurrent,0)),
        backgroundColor: COLORS[p]||'#ccc',
        borderRadius: 4,
      }))
    },
    options: chartOpts(true)
  });

  charts.c2 = new Chart(document.getElementById('cDonut').getContext('2d'), {
    type:'doughnut',
    data:{
      labels: persons,
      datasets:[{
        data: persons.map(p=>byP[p].recSigne),
        backgroundColor: persons.map(p=>COLORS[p]||'#ccc'),
        borderWidth:0
      }]
    },
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'right',labels:{font:{family:'Inter',size:11},boxWidth:11}}}}
  });
}

// ── TRIMESTRIELLE ──────────────────────────────────────────────────
function renderTrimestrielle(data, persons) {
  const qs = ['Q1','Q2','Q3','Q4'];
  const qColors = ['#2B4EE6','#5BC98A','#F5A623','#F47B6E'];

  const qSigne = {}, qFact = {};
  qs.forEach(q => {
    qSigne[q] = allSig.filter(d=>activePersons.has(d.person)&&QUARTERS[q].includes(d.moisSig)).reduce((s,d)=>s+d.recurrent,0);
    qFact[q]  = allSig.filter(d=>activePersons.has(d.person)&&QUARTERS[q].includes(d.moisFact)).reduce((s,d)=>s+d.recurrent,0);
  });

  const byPQ = {};
  persons.forEach(p => {
    byPQ[p] = {};
    qs.forEach(q => {
      const facture = allSig.filter(d=>d.person===p&&QUARTERS[q].includes(d.moisFact)).reduce((s,d)=>s+d.recurrent,0);
      const obj     = OBJECTIVES[p]?.[q] || 0;
      const pct     = obj > 0 ? Math.round(facture/obj*100) : null;
      byPQ[p][q]    = { facture, obj, pct };
    });
  });

  const activeQ = [...new Set([...activeMonths].map(getQ).filter(Boolean))];

  document.getElementById('mainContent').innerHTML = `
    <div class="section-title">Bilan trimestriel <span class="pill">2026</span></div>
    <div class="kpi-grid">
      ${qs.map((q,i)=>`
        <div class="kpi-card ${['blue','green','yellow','coral'][i]}">
          <div class="kpi-label">${q} — Récurrent Facturé</div>
          <div class="kpi-value">${fmt(qFact[q])}</div>
          <div class="kpi-sub">Signé : ${fmt(qSigne[q])}</div>
        </div>`).join('')}
    </div>

    <div class="section-title">Facturé vs Objectif par commercial</div>
    <div class="chart-card">
      <div class="chart-wrap" style="height:270px"><canvas id="cQBar"></canvas></div>
    </div>

    <div class="section-title">Atteinte des objectifs (base facturé)</div>
    <div class="table-card">
      <table>
        <thead><tr>
          <th>Commercial</th>
          ${qs.map(q=>`<th>${q} Facturé</th><th>${q} Obj.</th><th>${q} %</th>`).join('')}
        </tr></thead>
        <tbody>
          ${persons.map(p=>`<tr>
            <td><span style="display:inline-flex;align-items:center;gap:7px">
              <span class="dot" style="background:${COLORS[p]||'#ccc'}"></span>
              <strong>${p}</strong>
            </span></td>
            ${qs.map(q=>{
              const d=byPQ[p][q];
              const cls=d.pct===null?'grey':d.pct>=100?'green':d.pct>=70?'yellow':'red';
              return `<td>${fmt(d.facture)}</td>
                <td>${d.obj?fmt(d.obj):'<span style="color:var(--grey-text)">—</span>'}</td>
                <td>${d.pct!==null?`<span class="badge ${cls}">${d.pct}%</span>`:'<span style="color:var(--grey-text)">—</span>'}</td>`;
            }).join('')}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;

  destroyCharts();

  charts.c1 = new Chart(document.getElementById('cQBar').getContext('2d'), {
    type:'bar',
    data:{
      labels: persons,
      datasets:[
        ...activeQ.map(q=>({
          label:`${q} Facturé`,
          data: persons.map(p=>byPQ[p][q].facture),
          backgroundColor: qColors[qs.indexOf(q)]+'BB',
          borderRadius:4,
        })),
        ...activeQ.map(q=>({
          label:`${q} Objectif`,
          data: persons.map(p=>byPQ[p][q].obj),
          backgroundColor:'transparent',
          borderColor: qColors[qs.indexOf(q)],
          borderWidth:2,
          borderRadius:4,
          type:'bar',
        })),
      ]
    },
    options: chartOpts(false)
  });
}

function render() {
  const data    = getFiltered();
  const persons = [...activePersons].sort();
  if (currentView==='mensuelle') renderMensuelle(data, persons);
  else renderTrimestrielle(data, persons);
}

loadData();
</script>
</body>
</html>
