<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qualineo — Performance Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root {
    --blue:#2B4EE6;--blue-dark:#1A3599;--blue-light:#3D6BF5;--navy:#0F2060;
    --yellow:#F5A623;--coral:#F47B6E;--green:#5BC98A;--purple:#7C3AED;
    --white:#FFFFFF;--cream:#FDF6EF;--grey-light:#E8EDF5;--grey-text:#6B7A99;--text-dark:#1A2340;
    /* Couleurs bilan trimestriel (distinctes des commerciaux) */
    --q1:#7C3AED;--q2:#0891B2;--q3:#059669;--q4:#DC2626;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--text-dark);min-height:100vh;}

  .header{background:linear-gradient(135deg,#1A3599 0%,#2B4EE6 50%,#3D6BF5 100%);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;}
  .logo{display:flex;align-items:center;gap:12px;}
  .logo-icon{width:38px;height:38px;background:rgba(255,255,255,0.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:white;}
  .logo-text{font-size:20px;font-weight:700;color:white;}
  .header-sub{font-size:13px;color:rgba(255,255,255,0.7);}
  .last-update{font-size:12px;color:rgba(255,255,255,0.6);text-align:right;cursor:pointer;}
  .last-update:hover{color:white;}

  .filters{background:white;padding:10px 32px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(43,78,230,0.08);position:sticky;top:0;z-index:10;}
  .filter-label{font-size:11px;font-weight:600;color:var(--grey-text);white-space:nowrap;}
  .filter-btn{padding:5px 13px;border-radius:999px;border:2px solid var(--grey-light);background:white;color:var(--text-dark);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;}
  .filter-btn.active{background:var(--blue);color:white;border-color:var(--blue);}
  .divider{width:1px;height:20px;background:var(--grey-light);flex-shrink:0;}
  .select-all-btn{padding:4px 10px;border-radius:999px;border:1.5px dashed var(--grey-text);background:white;color:var(--grey-text);font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s;}
  .select-all-btn:hover{border-color:var(--blue);color:var(--blue);}

  .main{padding:22px 32px;max-width:1500px;margin:0 auto;}
  .section-title{font-size:15px;font-weight:700;color:var(--navy);margin:22px 0 12px;display:flex;align-items:center;gap:8px;}
  .pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--blue);color:white;}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;}
  .kpi-card{background:white;border-radius:18px;padding:18px 20px;box-shadow:0 4px 24px rgba(43,78,230,0.08);}
  .kpi-card.blue{background:linear-gradient(135deg,#2B4EE6,#3D6BF5);color:white;}
  .kpi-card.yellow{background:var(--yellow);color:white;}
  .kpi-card.green{background:var(--green);color:white;}
  .kpi-card.coral{background:var(--coral);color:white;}
  .kpi-card.q1c{background:var(--q1);color:white;}
  .kpi-card.q2c{background:var(--q2);color:white;}
  .kpi-card.q3c{background:var(--q3);color:white;}
  .kpi-card.q4c{background:var(--q4);color:white;}
  .kpi-label{font-size:11px;font-weight:500;opacity:0.8;margin-bottom:5px;}
  .kpi-value{font-size:24px;font-weight:800;line-height:1;margin-bottom:3px;}
  .kpi-sub{font-size:11px;font-weight:500;opacity:0.7;}

  .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .charts-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .chart-card{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 24px rgba(43,78,230,0.08);}
  .chart-card h3{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:12px;}
  .chart-wrap{position:relative;height:220px;}
  .chart-wrap-lg{position:relative;height:270px;}

  .table-card{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 24px rgba(43,78,230,0.08);margin-top:16px;overflow-x:auto;}
  .table-card h3{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:12px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:8px 11px;font-size:10px;font-weight:600;color:var(--grey-text);text-transform:uppercase;letter-spacing:0.4px;background:var(--cream);}
  td{padding:9px 11px;border-bottom:1px solid var(--grey-light);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#f8faff;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;}
  .badge.green{background:rgba(91,201,138,0.15);color:#1e8a52;}
  .badge.yellow{background:rgba(245,166,35,0.15);color:#a06b00;}
  .badge.red{background:rgba(244,123,110,0.15);color:#b03020;}
  .badge.grey{background:var(--grey-light);color:var(--grey-text);}

  /* Squad banners */
  .squad-section{margin-bottom:20px;}
  .squad-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px 16px;border-radius:12px;}
  .squad-caroline{background:linear-gradient(90deg,rgba(244,123,110,0.12),rgba(244,123,110,0.04));border-left:4px solid var(--coral);}
  .squad-antoine{background:linear-gradient(90deg,rgba(43,78,230,0.10),rgba(43,78,230,0.03));border-left:4px solid var(--blue);}
  .squad-label{font-size:13px;font-weight:700;color:var(--navy);}
  .squad-sub{font-size:11px;color:var(--grey-text);}

  /* Future month styling */
  .future-month{opacity:0.55;}
  .future-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(107,122,153,0.12);color:var(--grey-text);margin-left:6px;}

  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:14px;}
  .spinner{width:44px;height:44px;border:4px solid var(--grey-light);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{font-size:14px;color:var(--grey-text);font-weight:500;}

  @media(max-width:768px){
    .main{padding:12px;}.header{padding:14px;}.filters{padding:10px 12px;}
    .charts-grid,.charts-grid-3{grid-template-columns:1fr;}.kpi-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">Q</div>
    <span class="logo-text">Qualineo</span>
  </div>
  <div style="text-align:center">
    <div style="font-size:15px;font-weight:600;color:white">Performance Dashboard</div>
    <div class="header-sub">Équipe Commerciale 2026</div>
  </div>
  <div class="last-update" id="lastUpdate" onclick="loadData()" title="Cliquer pour rafraîchir">—</div>
</div>

<div class="filters">
  <span class="filter-label">VUE :</span>
  <button class="filter-btn active" id="btn-mensuelle"      onclick="setView('mensuelle')">Mensuelle</button>
  <button class="filter-btn"        id="btn-trimestrielle"  onclick="setView('trimestrielle')">Trimestrielle</button>
  <button class="filter-btn"        id="btn-annuelle"       onclick="setView('annuelle')">Annuelle</button>
  <div class="divider"></div>
  <span class="filter-label">SQUAD :</span>
  <button class="select-all-btn" id="squadSelectAll" onclick="toggleSelectAllSquads()">Tout</button>
  <div id="squadFilters" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
  <div class="divider"></div>
  <span class="filter-label">MOIS :</span>
  <button class="select-all-btn" id="monthSelectAll" onclick="toggleSelectAllMonths()">Tout</button>
  <div id="monthFilters" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
  <div class="divider"></div>
  <span class="filter-label">COMMERCIAL :</span>
  <button class="select-all-btn" id="personSelectAll" onclick="toggleSelectAllPersons()">Tout</button>
  <div id="personFilters" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
</div>

<div class="main" id="mainContent">
  <div class="loading"><div class="spinner"></div><div class="loading-text">Chargement…</div></div>
</div>

<script>
const SHEET_ID = '1NfpK8RpEu-dftc2NildbKzsnDcxMYV9s0HnSHwM5ZVc';
const OBJECTIVES_SHEET_NAME = 'Feuille 3';

// Rempli dynamiquement par loadObjectives() à partir de l'onglet Feuille 3
let OBJECTIVES = {};

// Squads :
// Q1 & Q2 : 1 seule squad "Caroline" → Caroline, Antoine, Arthur, Baptiste (Lucas = Head of Sales, hors squad)
// Q3 & Q4 : 2 squads → "Squad Caroline" (Caroline, Arthur, Baptiste) + "Squad Antoine" (Antoine)
const SQUADS_BY_HALF = {
  H1: [
    { key:'Caroline', label:'Squad Caroline', members:['Caroline','Antoine','Arthur','Baptiste'], color:'#F47B6E' }
  ],
  H2: [
    { key:'Caroline', label:'Squad Caroline', members:['Caroline','Arthur','Baptiste'], color:'#F47B6E' },
    { key:'Antoine',  label:'Squad Antoine',  members:['Antoine', 'Alix'],                 color:'#2B4EE6' }
  ]
};
// HEAD_OF_SALES : jamais dans une squad
const HEAD_OF_SALES = ['Lucas'];

const MONTHS_ORDER = [
  'janv. 2026','févr. 2026','mars 2026','avr. 2026','mai 2026','juin 2026',
  'juil. 2026','août 2026','sept. 2026','oct. 2026','nov. 2026','déc. 2026'
];
const QUARTERS = {
  Q1:['janv. 2026','févr. 2026','mars 2026'],
  Q2:['avr. 2026','mai 2026','juin 2026'],
  Q3:['juil. 2026','août 2026','sept. 2026'],
  Q4:['oct. 2026','nov. 2026','déc. 2026']
};
const COLORS = {
  Antoine:'#2B4EE6', Arthur:'#5BC98A', Caroline:'#F47B6E',
  Baptiste:'#F5A623', Lucas:'#9B59B6', Alix:'#E91E8C', Antony:'#1ABC9C', Frederic:'#E67E22'
};
const Q_COLORS = ['#7C3AED','#0891B2','#059669','#DC2626']; // distinct des couleurs commerciaux

let allSig = [];
let currentView = 'mensuelle';
let activeMonths = new Set();
let activePersons = new Set();
let allMonthsInData = [];
let allPersonsInData = [];
let activeSquads = new Set(['Caroline','Antoine','HOS']);
let charts = {};

// Mois courant pour séparation passé/futur
const NOW = new Date();
const CURRENT_MONTH_IDX = MONTHS_ORDER.findIndex(m => {
  const d = parseMonthLabel(m);
  return d.getFullYear() === NOW.getFullYear() && d.getMonth() === NOW.getMonth();
});

function parseMonthLabel(label) {
  const map = {
    'janv.':0,'févr.':1,'mars':2,'avr.':3,'mai':4,'juin':5,
    'juil.':6,'août':7,'sept.':8,'oct.':9,'nov.':10,'déc.':11
  };
  const [m, y] = label.split(' ');
  return new Date(parseInt(y), map[m]||0, 1);
}

function isFutureMonth(mLabel) {
  const idx = MONTHS_ORDER.indexOf(mLabel);
  return idx > CURRENT_MONTH_IDX;
}

function isQuarterFuture(q) {
  return QUARTERS[q].every(m => isFutureMonth(m));
}
function isQuarterPartialFuture(q) {
  return QUARTERS[q].some(m => isFutureMonth(m)) && !isQuarterFuture(q);
}

function getQuarterFromMonth(m) {
  for(const [q,ms] of Object.entries(QUARTERS)) if(ms.includes(m)) return q;
  return null;
}

function pn(v) {
  if (!v && v !== 0) return 0;
  return parseFloat(String(v).replace(/\s/g,'').replace(',','.')) || 0;
}
function fmt(n)  { return Math.round(n||0).toLocaleString('fr-FR') + ' €'; }
function fmtK(n) { const v = Math.round(n||0); return v >= 1000 ? (v/1000).toFixed(0)+'k' : String(v); }

// ────────────────────────────────────────────────────────────────
// Dégradé orange → jaune → vert pour les %ages d'atteinte
// ────────────────────────────────────────────────────────────────
function hexToRgb(hex) {
  hex = hex.replace('#','');
  return { r: parseInt(hex.substr(0,2),16), g: parseInt(hex.substr(2,2),16), b: parseInt(hex.substr(4,2),16) };
}
function lerpColor(c1, c2, t) {
  const a = hexToRgb(c1), b = hexToRgb(c2);
  const r = Math.round(a.r + (b.r-a.r)*t);
  const g = Math.round(a.g + (b.g-a.g)*t);
  const bl = Math.round(a.b + (b.b-a.b)*t);
  return `rgb(${r},${g},${bl})`;
}
function pctGradientColor(pctNum) {
  if (pctNum === null || pctNum === undefined || isNaN(pctNum)) return '#9AA5B8';
  const p = Math.max(0, pctNum);
  if (p <= 50)  return lerpColor('#E8574A','#F5A623', p/50);
  if (p <= 100) return lerpColor('#F5A623','#3DA873', (p-50)/50);
  return '#1E8A52'; // au-delà de 100%, vert soutenu
}
function pctBadge(pctNum, extra) {
  if (pctNum === null || pctNum === undefined || isNaN(pctNum)) {
    return `<span class="badge" style="background:var(--grey-light);color:var(--grey-text)">—</span>`;
  }
  const c = pctGradientColor(pctNum);
  return `<span class="badge" style="background:${c}22;color:${c}${extra?';'+extra:''}">${pctNum.toFixed(1)}%</span>`;
}
// Grille %age (remplace les histogrammes Facturé vs Objectif)
function pctGridTable(members, dataGetter, qs) {
  let html = `<table style="width:100%;border-collapse:collapse">
    <thead><tr><th style="text-align:left">Commercial</th>${qs.map(q=>`<th style="text-align:center">${q}</th>`).join('')}</tr></thead><tbody>`;
  members.forEach(p => {
    html += `<tr><td style="white-space:nowrap"><span style="display:inline-flex;align-items:center;gap:7px">
      <span class="dot" style="background:${COLORS[p]||'#ccc'}"></span><strong>${p}</strong></span></td>`;
    qs.forEach(q => {
      const d = dataGetter(p,q);
      const pctNum = d.obj>0 ? (d.facture/d.obj*100) : null;
      html += `<td style="text-align:center">
        ${pctBadge(pctNum,'font-size:13px;padding:3px 12px')}
        <div style="font-size:10px;color:var(--grey-text);margin-top:3px">${fmt(d.facture)} / ${d.obj?fmt(d.obj):'—'}</div>
      </td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

async function loadObjectives() {
  try {
    const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(OBJECTIVES_SHEET_NAME)}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    const obj = {};
    rows.forEach(r => {
      const nom = (r['Nom'] || '').trim();
      if (!nom) return;
      if (nom.toLowerCase() === 'squad') return;
      if (nom.toLowerCase().includes('total')) return;
      obj[nom] = {
        Q1: pn(r['Q1_Objectif']),
        Q2: pn(r['Q2_Objectif']),
        Q3: pn(r['Q3_Objectif']),
        Q4: pn(r['Q4_Objectif']),
      };
    });
    OBJECTIVES = obj;
  } catch(e) {
    console.error('Erreur chargement objectifs (Feuille 3):', e);
  }
}

async function loadData() {
  document.getElementById('lastUpdate').textContent = '↻ Chargement…';
  try {
    const [res] = await Promise.all([
      fetch(`https://opensheet.elk.sh/${SHEET_ID}/Signatures`),
      loadObjectives()
    ]);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();

    allSig = rows
      .map(r => ({
        devis:    (r['N° Devis'] || '').trim(),
        person:   (r['Signé par'] || '').trim(),
        moisSig:  (r['Mois signature'] || '').trim(),
        moisFact: (r['Mois facturation'] || '').trim(),
        montant:  pn(r['Montant (€ HT)']),
        partQ:    pn(r['Part Qualineo']),
        recurrent:pn(r['Dont récurrent']),
        dateStr:  (r['Date signature'] || '').trim(),
      }))
      .filter(r => r.person && r.moisSig && MONTHS_ORDER.includes(r.moisSig));

    // Toujours tous les mois (y compris futurs)
    allMonthsInData  = [...MONTHS_ORDER];
    allPersonsInData = [...new Set(allSig.map(d => d.person))].sort();

    activeMonths  = new Set(allMonthsInData);
    activePersons = new Set(allPersonsInData);

    buildFilters(allMonthsInData, allPersonsInData);
    buildSquadFilters();
    document.getElementById('lastUpdate').textContent =
      '↻ ' + new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    render();
  } catch(e) {
    document.getElementById('mainContent').innerHTML =
      `<div style="background:white;border-radius:18px;padding:32px;text-align:center;margin-top:20px;box-shadow:0 4px 24px rgba(43,78,230,0.08)">
        <div style="font-size:32px;margin-bottom:10px">⚠️</div>
        <h3 style="color:#F47B6E;margin-bottom:8px">Erreur de chargement</h3>
        <p style="color:#6B7A99;font-size:13px">${e.message}</p>
      </div>`;
    document.getElementById('lastUpdate').textContent = '↻ Erreur — cliquer pour réessayer';
  }
}

// Squad filter helpers
const SQUAD_DEFS = [
  { key:'Caroline', label:'Squad Caroline', color:'#F47B6E' },
  { key:'Antoine',  label:'Squad Antoine',  color:'#2B4EE6' },
  { key:'HOS',      label:'Head of Sales',  color:'#9B59B6' },
];

function membersOfSquad(key) {
  if (key === 'HOS') return HEAD_OF_SALES;
  // union H1+H2 pour avoir tous les membres possibles
  const all = new Set();
  [...SQUADS_BY_HALF.H1, ...SQUADS_BY_HALF.H2].forEach(sq => {
    if (sq.key === key) sq.members.forEach(m => all.add(m));
  });
  return [...all];
}

function syncPersonsFromSquads() {
  // Recalcule activePersons selon les squads actives
  // On ne touche pas aux boutons commerciaux individuels — les squads sont un filtre rapide
  allPersonsInData.forEach(p => {
    const inSquad = SQUAD_DEFS.some(sq => activeSquads.has(sq.key) && membersOfSquad(sq.key).includes(p));
    if (inSquad) activePersons.add(p);
    else activePersons.delete(p);
  });
  // Sync visuel des boutons commerciaux
  document.querySelectorAll('#personFilters .filter-btn').forEach(btn => {
    const p = btn.dataset.person;
    const c = COLORS[p] || '#888';
    if (activePersons.has(p)) {
      btn.style.cssText = `background:${c};color:white;border-color:${c}`;
      btn.classList.add('active');
    } else {
      btn.style.cssText = `background:white;color:${c};border-color:${c}`;
      btn.classList.remove('active');
    }
  });
}

function buildSquadFilters() {
  const sf = document.getElementById('squadFilters');
  sf.innerHTML = '';
  SQUAD_DEFS.forEach(sq => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn active';
    btn.dataset.squad = sq.key;
    btn.textContent = sq.label;
    btn.style.cssText = `background:${sq.color};color:white;border-color:${sq.color}`;
    btn.onclick = () => {
      if (activeSquads.has(sq.key)) {
        activeSquads.delete(sq.key);
        btn.style.cssText = `background:white;color:${sq.color};border-color:${sq.color}`;
        btn.classList.remove('active');
      } else {
        activeSquads.add(sq.key);
        btn.style.cssText = `background:${sq.color};color:white;border-color:${sq.color}`;
        btn.classList.add('active');
      }
      syncPersonsFromSquads();
      render();
    };
    sf.appendChild(btn);
  });
}

let squadSelectAllState = true;
function toggleSelectAllSquads() {
  squadSelectAllState = !squadSelectAllState;
  document.querySelectorAll('#squadFilters .filter-btn').forEach(btn => {
    const key = btn.dataset.squad;
    const sq = SQUAD_DEFS.find(s => s.key === key);
    if (squadSelectAllState) {
      activeSquads.add(key);
      btn.style.cssText = `background:${sq.color};color:white;border-color:${sq.color}`;
      btn.classList.add('active');
    } else {
      activeSquads.delete(key);
      btn.style.cssText = `background:white;color:${sq.color};border-color:${sq.color}`;
      btn.classList.remove('active');
    }
  });
  document.getElementById('squadSelectAll').textContent = squadSelectAllState ? 'Tout' : 'Aucun';
  syncPersonsFromSquads();
  render();
}

let monthSelectAllState = true;
function toggleSelectAllMonths() {
  monthSelectAllState = !monthSelectAllState;
  const btns = document.querySelectorAll('#monthFilters .filter-btn');
  btns.forEach(btn => {
    const m = btn.dataset.month;
    if (monthSelectAllState) { activeMonths.add(m); btn.classList.add('active'); }
    else { activeMonths.delete(m); btn.classList.remove('active'); }
  });
  document.getElementById('monthSelectAll').textContent = monthSelectAllState ? 'Tout' : 'Aucun';
  render();
}

let personSelectAllState = true;
function toggleSelectAllPersons() {
  personSelectAllState = !personSelectAllState;
  const btns = document.querySelectorAll('#personFilters .filter-btn');
  btns.forEach(btn => {
    const p = btn.dataset.person;
    const c = COLORS[p] || '#888';
    if (personSelectAllState) {
      activePersons.add(p);
      btn.style.cssText = `background:${c};color:white;border-color:${c}`;
      btn.classList.add('active');
    } else {
      activePersons.delete(p);
      btn.style.cssText = `background:white;color:${c};border-color:${c}`;
      btn.classList.remove('active');
    }
  });
  document.getElementById('personSelectAll').textContent = personSelectAllState ? 'Tout' : 'Aucun';
  render();
}

function buildFilters(months, persons) {
  const mf = document.getElementById('monthFilters');
  mf.innerHTML = '';
  months.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn active';
    btn.dataset.month = m;
    btn.textContent = m.replace(' 2026','');
    if (isFutureMonth(m)) btn.style.opacity = '0.65';
    btn.onclick = () => {
      if (activeMonths.has(m)) { activeMonths.delete(m); btn.classList.remove('active'); }
      else { activeMonths.add(m); btn.classList.add('active'); }
      render();
    };
    mf.appendChild(btn);
  });

  const pf = document.getElementById('personFilters');
  pf.innerHTML = '';
  persons.forEach(p => {
    const c = COLORS[p] || '#888';
    const btn = document.createElement('button');
    btn.className = 'filter-btn active';
    btn.dataset.person = p;
    btn.textContent = p;
    btn.style.cssText = `background:${c};color:white;border-color:${c}`;
    btn.onclick = () => {
      if (activePersons.has(p)) {
        activePersons.delete(p);
        btn.style.cssText = `background:white;color:${c};border-color:${c}`;
        btn.classList.remove('active');
      } else {
        activePersons.add(p);
        btn.style.cssText = `background:${c};color:white;border-color:${c}`;
        btn.classList.add('active');
      }
      render();
    };
    pf.appendChild(btn);
  });
}

function setView(v) {
  currentView = v;
  ['mensuelle','trimestrielle','annuelle'].forEach(k =>
    document.getElementById('btn-'+k).classList.toggle('active', k===v));
  render();
}

function getFiltered() {
  return allSig.filter(d => activePersons.has(d.person) && activeMonths.has(d.moisSig));

function destroyCharts() {
  Object.values(charts).forEach(c => { try{ if(c && typeof c.destroy==='function') c.destroy(); }catch(e){} });

function chartOpts(stacked) {

    scales:{

function getSquadsForQuarter(q) {

}

// Génère des lignes de tableau groupées par squad (vue tableau globale = on utilise H2 pour montrer toutes les squads,
// avec mention de l'évolution pour les membres qui changent)
function squadRowsHTML(persons, dataFn, colspan, subtotalFn) {
  // subtotalFn(members) optionnel : retourne une <tr> de sous-total pour la squad
  const cols = colspan || 5;
  const html = [];
  const done = new Set();

  // Section H1 (Q1-Q2) : 1 seule squad avec tous
  const sq1 = SQUADS_BY_HALF.H1[0];
  const membersH1 = sq1.members.filter(p => persons.includes(p));
  if (membersH1.length) {
    html.push(`<tr style="background:linear-gradient(90deg,${sq1.color}18,${sq1.color}06)">
      <td colspan="${cols}" style="padding:6px 11px;font-size:11px;font-weight:700;color:${sq1.color};letter-spacing:0.3px">
        ${sq1.label} — Q1 &amp; Q2
      </td></tr>`);
    membersH1.forEach(p => { html.push(dataFn(p)); done.add(p); });
    if (subtotalFn) html.push(subtotalFn(membersH1, sq1.color, sq1.label+' Q1–Q2'));
  }

  // Séparateur H2
  html.push(`<tr style="background:#0F206008">
    <td colspan="${cols}" style="padding:5px 11px;font-size:10px;font-weight:600;color:var(--grey-text);letter-spacing:0.4px;text-transform:uppercase">
      ↓ Réorganisation Q3 &amp; Q4
    </td></tr>`);

  // Section H2 : squads séparées
  SQUADS_BY_HALF.H2.forEach(sq => {
    const members = sq.members.filter(p => persons.includes(p));
    if (!members.length) return;
    html.push(`<tr style="background:linear-gradient(90deg,${sq.color}18,${sq.color}06)">
      <td colspan="${cols}" style="padding:6px 11px;font-size:11px;font-weight:700;color:${sq.color};letter-spacing:0.3px">
        ${sq.label} — Q3 &amp; Q4
      </td></tr>`);
    members.forEach(p => { html.push(dataFn(p)); });
    if (subtotalFn) html.push(subtotalFn(members, sq.color, sq.label+' Q3–Q4'));
  });

  // Head of Sales
  persons.filter(p => HEAD_OF_SALES.includes(p)).forEach(p => {
    if (!done.has(p)) {
      html.push(`<tr style="background:#9B59B618">
        <td colspan="${cols}" style="padding:6px 11px;font-size:11px;font-weight:700;color:#9B59B6;letter-spacing:0.3px">
          Head of Sales
        </td></tr>`);
      html.push(dataFn(p));
    }
  });

  return html.join('');
}

function renderTrimestrielle(data, persons) {
  const qs = ['Q1','Q2','Q3','Q4'];

  const qSigne = {}, qFact = {};
  qs.forEach(q => {
    qSigne[q] = allSig.filter(d=>activePersons.has(d.person)&&QUARTERS[q].includes(d.moisSig)).reduce((s,d)=>s+d.recurrent,0);
    qFact[q]  = allSig.filter(d=>activePersons.has(d.person)&&QUARTERS[q].includes(d.moisFact)).reduce((s,d)=>s+d.recurrent,0);
  });

  // Objectif global par trimestre
  const qObjGlobal = {};
  qs.forEach(q => {
    qObjGlobal[q] = persons.reduce((s,p) => s+(OBJECTIVES[p]?.[q]||0), 0);
  });

  const byPQ = {};
  persons.forEach(p => {
    byPQ[p] = {};
    qs.forEach(q => {
      const facture = allSig.filter(d=>d.person===p&&QUARTERS[q].includes(d.moisFact)).reduce((s,d)=>s+d.recurrent,0);
      const obj     = OBJECTIVES[p]?.[q] || 0;
      const pct     = obj > 0 ? (facture/obj*100) : null;
      byPQ[p][q]    = { facture, obj, pct };
    });
  });

  // Colonnes : Q1 Fact | Q1 Obj | Q1 % | Q2 Fact | Q2 Obj | Q2 % | ...

    return `<tr>
      <td><span style="display:inline-flex;align-items:center;gap:7px">

          <div class="kpi-value">${fmt(qFact[q])}</div>

// Vue ANNUELLE

function renderAnnuelle(data, persons) {
  const qs = ['Q1','Q2','Q3','Q4'];

  // Totaux annuels globaux — filtrés sur activeMonths ET activePersons
  const allActiveSig    = allSig.filter(d=>activePersons.has(d.person) && activeMonths.has(d.moisSig));
  const totalAnnuelFact = allSig.filter(d=>activePersons.has(d.person)&&activeMonths.has(d.moisFact)).reduce((s,d)=>s+d.recurrent,0);
  const totalNbContrats = allActiveSig.length;
  const totalObjAnnuel  = persons.reduce((s,p)=>s+qs.reduce((sq,q)=>sq+(OBJECTIVES[p]?.[q]||0),0),0);
  const pctAnnuel       = totalObjAnnuel > 0 ? (totalAnnuelFact/totalObjAnnuel*100) : null;
  // Panier moyen global = Part Qualineo / nb contrats sur la sélection
  const totalPanierSig  = allActiveSig.reduce((s,d)=>s+d.partQ,0);
  const panierGlobal    = totalNbContrats > 0 ? Math.round(totalPanierSig/totalNbContrats) : 0;

  // Par personne — filtré sur activeMonths
  const annuelByP = {};
  persons.forEach(p => {
    const persSig  = allSig.filter(d=>d.person===p && activeMonths.has(d.moisSig));
    const persFact = allSig.filter(d=>d.person===p && activeMonths.has(d.moisFact));
    const facture  = persFact.reduce((s,d)=>s+d.recurrent,0);
    const partQ    = persSig.reduce((s,d)=>s+d.partQ,0);
    const nbCont   = persSig.length;
    const panier   = nbCont > 0 ? Math.round(partQ/nbCont) : 0;
    const obj      = qs.reduce((s,q)=>s+(OBJECTIVES[p]?.[q]||0),0);
    const pct      = obj > 0 ? (facture/obj*100) : null;
    const qData    = {};
    qs.forEach(q => {
      const f = allSig.filter(d=>d.person===p&&QUARTERS[q].includes(d.moisFact)&&activeMonths.has(d.moisFact)).reduce((s,d)=>s+d.recurrent,0);
      qData[q] = { facture:f, obj: OBJECTIVES[p]?.[q]||0 };
    });
    annuelByP[p] = { facture, partQ, nbCont, panier, obj, pct, qData };
  });

  const sorted = [...persons].sort((a,b)=>(annuelByP[b]?.facture||0)-(annuelByP[a]?.facture||0));
  const top    = sorted[0] || '—';

  // Panier moyen par squad
  function squadPanier(members) {
    const ml   = members.filter(p=>persons.includes(p));
    const tot  = ml.reduce((s,p)=>s+(annuelByP[p]?.partQ||0),0);
    const nb   = ml.reduce((s,p)=>s+(annuelByP[p]?.nbCont||0),0);
    return nb > 0 ? Math.round(tot/nb) : 0;
  }
  const panierCaroline = squadPanier(['Caroline','Arthur','Baptiste']);
  const panierAntoine  = squadPanier(['Antoine']);

  destroyCharts();
  document.getElementById('mainContent').innerHTML = `
    <div class="section-title">Bilan Annuel 2026 <span class="pill">Annual</span></div>
    <div class="kpi-grid">
      <div class="kpi-card blue">
        <div class="kpi-label">Récurrent Facturé (annuel)</div>
        <div class="kpi-value">${fmt(totalAnnuelFact)}</div>
        <div class="kpi-sub">${totalNbContrats} contrats · ${persons.length} commerciaux</div>
      </div>
      <div class="kpi-card green">
        <div class="kpi-label">Objectif Global</div>
        <div class="kpi-value">${fmt(totalObjAnnuel)}</div>
        <div class="kpi-sub">Somme des objectifs individuels</div>
      </div>
      <div class="kpi-card ${pctAnnuel!==null&&pctAnnuel>=100?'green':pctAnnuel>=70?'yellow':'coral'}">
        <div class="kpi-label">Taux d'atteinte global</div>
        <div class="kpi-value">${pctAnnuel!==null?pctAnnuel.toFixed(1)+'%':'—'}</div>
        <div class="kpi-sub">Facturé / Objectif</div>
      </div>
      <div class="kpi-card yellow">
        <div class="kpi-label">Top performer</div>
        <div class="kpi-value" style="font-size:18px">${top}</div>
        <div class="kpi-sub">${top!=='—'?fmt(annuelByP[top]?.facture||0):''}</div>
      </div>
    </div>

    <div class="section-title">Panier moyen <span class="pill">Part Qualineo / contrat</span></div>
    <div class="kpi-grid">
      <div class="kpi-card blue">
        <div class="kpi-label">Panier moyen global</div>
        <div class="kpi-value">${fmt(panierGlobal)}</div>
        <div class="kpi-sub">${totalNbContrats} contrats au total</div>
      </div>
      <div class="kpi-card" style="background:linear-gradient(135deg,#F47B6E,#e05a4d);color:white">
        <div class="kpi-label">Squad Caroline</div>
        <div class="kpi-value">${fmt(panierCaroline)}</div>
        <div class="kpi-sub">Caroline · Arthur · Baptiste</div>
      </div>
      <div class="kpi-card" style="background:linear-gradient(135deg,#2B4EE6,#1A3599);color:white">
        <div class="kpi-label">Squad Antoine</div>
        <div class="kpi-value">${fmt(panierAntoine)}</div>
        <div class="kpi-sub">Antoine (Q3–Q4)</div>
      </div>
      ${sorted.map(p=>`
      <div class="kpi-card">
        <div class="kpi-label" style="color:${COLORS[p]||'#888'}">${p}</div>
        <div class="kpi-value" style="font-size:20px">${fmt(annuelByP[p].panier)}</div>
        <div class="kpi-sub">${annuelByP[p].nbCont} contrat${annuelByP[p].nbCont>1?'s':''}</div>
      </div>`).join('')}
    </div>

    <div class="section-title">Panier moyen par commercial</div>
    <div class="chart-card">
      <div class="chart-wrap-lg"><canvas id="cAnnPanier"></canvas></div>
    </div>

    <div class="section-title">Squads — Bilan annuel <span class="pill">%age atteinte</span></div>
    <div class="charts-grid">
      <div class="chart-card">
        <div class="squad-header squad-caroline" style="margin-bottom:10px">
          <span style="font-size:16px">🏷</span>
          <div><div class="squad-label" style="color:#b03020;font-size:12px">Squad Caroline</div>
          <div class="squad-sub">Caroline · Arthur · Baptiste — toute l'année (+ Antoine en Q1–Q2)</div></div>
        </div>
        ${pctGridTable(['Caroline','Arthur','Baptiste'].filter(p=>persons.includes(p)), (p,q)=>annuelByP[p].qData[q], qs)}
      </div>
      <div class="chart-card">
        <div class="squad-header squad-antoine" style="margin-bottom:10px">
          <span style="font-size:16px">🏷</span>
          <div><div class="squad-label" style="color:#1A3599;font-size:12px">Squad Antoine</div>
          <div class="squad-sub">Q1–Q2 : dans Squad Caroline &nbsp;|&nbsp; Q3–Q4 : lead indépendant</div></div>
        </div>
        ${pctGridTable(['Antoine','Alix'].filter(p=>persons.includes(p)), (p,q)=>annuelByP[p].qData[q], qs)}
      </div>
    </div>

    <div class="section-title">Tableau récapitulatif annuel</div>
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th rowspan="2">Commercial</th>
            ${qs.map((q,i)=>`<th colspan="2" style="background:${Q_COLORS[i]}18;color:${Q_COLORS[i]};text-align:center">${q}</th>`).join('')}
            <th colspan="4" style="background:#0F206018;color:#0F2060;text-align:center">ANNUEL</th>
          </tr>
          <tr>
            ${qs.map(()=>`<th>Facturé</th><th>Objectif</th>`).join('')}
            <th>Facturé</th><th>Objectif</th><th>Atteinte</th><th>Panier moy.</th>
          </tr>
        </thead>
        <tbody>
          ${squadRowsHTML(sorted, p => {
            const d = annuelByP[p];
            return `<tr>
              <td><span style="display:inline-flex;align-items:center;gap:7px">
                <span class="dot" style="background:${COLORS[p]||'#ccc'}"></span>
                <strong>${p}</strong>
              </span></td>
              ${qs.map(q=>`
                <td>${fmt(d.qData[q].facture)}</td>
                <td>${d.qData[q].obj?fmt(d.qData[q].obj):'—'}</td>
              `).join('')}
              <td><strong>${fmt(d.facture)}</strong></td>
              <td>${d.obj?fmt(d.obj):'—'}</td>
              <td>${pctBadge(d.pct)}</td>
              <td><strong>${fmt(d.panier)}</strong> <span style="font-size:10px;color:var(--grey-text)">${d.nbCont} ct.</span></td>
            </tr>`;
          }, 12, (members, color, label) => {
            const totF = members.reduce((s,p)=>s+(annuelByP[p]?.facture||0),0);
            const totO = members.reduce((s,p)=>s+(annuelByP[p]?.obj||0),0);
            const totPct = totO>0?(totF/totO*100):null;
            const totNb = members.reduce((s,p)=>s+(annuelByP[p]?.nbCont||0),0);
            const totPan = totNb>0?Math.round(members.reduce((s,p)=>s+(annuelByP[p]?.partQ||0),0)/totNb):0;
            return `<tr style="background:${color}12;font-weight:700">
              <td style="color:${color};padding-left:20px">Sous-total ${label}</td>
              ${qs.map(q=>{
                const f=members.reduce((s,p)=>s+(annuelByP[p]?.qData[q]?.facture||0),0);
                const o=members.reduce((s,p)=>s+(annuelByP[p]?.qData[q]?.obj||0),0);
                return `<td>${fmt(f)}</td><td>${o?fmt(o):'—'}</td>`;
              }).join('')}
              <td>${fmt(totF)}</td>
              <td>${totO?fmt(totO):'—'}</td>
              <td>${pctBadge(totPct)}</td>
              <td>${fmt(totPan)} <span style="font-size:10px;color:var(--grey-text)">${totNb} ct.</span></td>
            </tr>`;
          })}
          <tr style="background:#0F206010;font-weight:700">
            <td><strong>TOTAL</strong></td>
            ${qs.map(q=>{
              const f = persons.reduce((s,p)=>s+(annuelByP[p]?.qData[q]?.facture||0),0);
              const o = persons.reduce((s,p)=>s+(annuelByP[p]?.qData[q]?.obj||0),0);
              return `<td><strong>${fmt(f)}</strong></td><td>${fmt(o)}</td>`;
            }).join('')}
            <td><strong>${fmt(totalAnnuelFact)}</strong></td>
            <td><strong>${fmt(totalObjAnnuel)}</strong></td>
            <td>${pctBadge(pctAnnuel)}</td>
            <td><strong>${fmt(panierGlobal)}</strong> <span style="font-size:10px;color:var(--grey-text)">${totalNbContrats} ct.</span></td>
          </tr>
        </tbody>
      </table>
    </div>`;

  setTimeout(() => {

  // Graphique panier moyen par commercial
  try {
  charts.cAnnPanier = new Chart(document.getElementById('cAnnPanier').getContext('2d'), {
    type:'bar',
    data:{
      labels: sorted,
      datasets:[{
        label:'Panier moyen (Part Qualineo / contrat)',
        data: sorted.map(p=>annuelByP[p].panier),
        backgroundColor: sorted.map(p=>(COLORS[p]||'#ccc')+'CC'),
        borderRadius:6,
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label: ctx=>' '+fmt(ctx.raw)}}
      },
      scales:{
        x:{grid:{display:false},ticks:{font:{family:'Inter',size:11}}},
        y:{grid:{color:'#E8EDF5'},ticks:{font:{family:'Inter',size:11},callback:v=>fmtK(v)+' €'}}
      }
    }
  });
  } catch(e) { console.error('cAnnPanier error:', e); }

  }, 0); // end setTimeout
}

// ────────────────────────────────────────────────────────────────
// Render dispatch
// ────────────────────────────────────────────────────────────────
function render() {
  const data    = getFiltered();
  const persons = [...activePersons].sort();
  if      (currentView==='mensuelle')     renderMensuelle(data, persons);
  else if (currentView==='trimestrielle') renderTrimestrielle(data, persons);
  else                                    renderAnnuelle(data, persons);
}

loadData();
</script>
</body>
</html>
